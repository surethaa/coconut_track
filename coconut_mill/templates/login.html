{% extends "auth_base.html" %}
{% block title %}Log in · Coconut Mill Ledger{% endblock %}
{% block content %}
<h2>Log in</h2>
<p class="sub">Use your email and password.</p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="username" autofocus required></div>
  <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
  <button class="primary" type="submit">Log in</button>
</form>
<div class="auth-links"><a href="{{ url_for('forgot') }}">Forgot password?</a><a href="#" data-install hidden>Install app</a></div>
{% endblock %}
