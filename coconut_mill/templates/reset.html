{% extends "auth_base.html" %}
{% block title %}Choose a new password · Coconut Mill Ledger{% endblock %}
{% block content %}
<h2>Choose a new password</h2>
<form method="post" action="{{ url_for('reset', token=token) }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label for="password">New password (at least 8 characters)</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="8" autofocus required></div>
  <div class="field"><label for="confirm">Confirm password</label><input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required></div>
  <button class="primary" type="submit">Save password</button>
</form>
{% endblock %}
